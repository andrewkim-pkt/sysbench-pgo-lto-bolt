# pg-c.conf -- identical settings to the lost 48xl lattice campaign (recreated 2026-09-23 on us-east-2).
# NOT durability-realistic: synchronous_commit/full_page_writes off, wal_level minimal.
listen_addresses = '*'
port = 5432
unix_socket_directories = '/tmp'
max_connections = 1500
shared_buffers = 200GB
huge_pages = on
huge_page_size = 1GB
work_mem = 8MB
maintenance_work_mem = 4GB
temp_buffers = 16MB
max_files_per_process = 4000
synchronous_commit = off
full_page_writes = off
wal_level = minimal
max_wal_senders = 0
wal_buffers = 1GB
max_wal_size = 64GB
min_wal_size = 8GB
checkpoint_timeout = 30min
checkpoint_completion_target = 0.9
effective_cache_size = 1000GB
random_page_cost = 1.0
seq_page_cost = 1.0
effective_io_concurrency = 200
jit = off
autovacuum = on
autovacuum_max_workers = 8
autovacuum_naptime = 10s
autovacuum_vacuum_cost_delay = 0
bgwriter_delay = 10ms
bgwriter_lru_maxpages = 1000
max_locks_per_transaction = 256
logging_collector = off
log_min_messages = warning
